name: Build & Manifesto Guard

on:
  push:
    branches: [main]
    # Don't burn a build on documentation-only changes.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifesto-guard:
    name: Enforce bloatware-free manifesto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid INTERNET permission in manifest
        run: |
          set -e
          # Parse each AndroidManifest.xml with xmllint and look for an actual
          # <uses-permission> element naming INTERNET. xmllint ignores XML
          # comments natively, so explanatory text in the manifest is safe.
          shopt -s globstar nullglob
          FAIL=0
          for f in app/src/**/AndroidManifest.xml; do
            HITS=$(xmllint --xpath \
              "count(//uses-permission[@*[local-name()='name' and .='android.permission.INTERNET']])" \
              "$f" 2>/dev/null || echo 0)
            if [ "$HITS" != "0" ]; then
              echo "❌ INTERNET permission found in $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "✅ No INTERNET permission in any manifest."

      - name: Forbid analytics / ads / crash-reporting dependencies
        run: |
          set -e
          BLOCK_PATTERN='com\.google\.firebase|com\.google\.android\.gms\.ads|com\.crashlytics|com\.mixpanel|com\.amplitude|io\.segment|com\.facebook\.android|com\.adjust|com\.appsflyer'
          if grep -rE "$BLOCK_PATTERN" app/build.gradle.kts gradle/libs.versions.toml 2>/dev/null; then
            echo "❌ Forbidden tracking/ads dependency detected."
            exit 1
          fi
          echo "✅ No tracking, ads, or cloud-crash-reporting dependencies."

      - name: Forbid HTTP client libraries (we don't need internet)
        run: |
          set -e
          # Allow none of the common HTTP/networking libs.
          BLOCK_PATTERN='com\.squareup\.okhttp|com\.squareup\.retrofit|io\.ktor|com\.android\.volley'
          if grep -rE "$BLOCK_PATTERN" app/build.gradle.kts gradle/libs.versions.toml 2>/dev/null; then
            echo "❌ HTTP client library detected — this app must be fully offline."
            exit 1
          fi
          echo "✅ No HTTP client libraries."

  build:
    name: Build debug + run tests
    runs-on: ubuntu-latest
    needs: manifesto-guard
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      # Catch release-only fatal lint (lintVitalRelease) here, before tagging —
      # so the release workflow never fails on a lint issue at tag time.
      # No signing needed: lint only analyzes sources/manifest.
      - name: Lint (release fatal checks)
        run: gradle lintVitalRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medalarm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
