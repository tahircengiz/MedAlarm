name: Release

# Triggered by pushing a tag like v0.1.0-beta1.
# Builds a signed release APK and publishes a GitHub Release with it attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build signed APK + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuse the same manifesto guard as CI — a release must also be clean.
      - name: Forbid INTERNET permission in manifest
        run: |
          set -e
          shopt -s globstar nullglob
          FAIL=0
          for f in app/src/**/AndroidManifest.xml; do
            HITS=$(xmllint --xpath \
              "count(//uses-permission[@*[local-name()='name' and .='android.permission.INTERNET']])" \
              "$f" 2>/dev/null || echo 0)
            if [ "$HITS" != "0" ]; then echo "❌ INTERNET in $f"; FAIL=1; fi
          done
          [ "$FAIL" = "1" ] && exit 1 || echo "✅ No INTERNET permission."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ SIGNING_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medalarm-release.p12"
          echo "Keystore decoded to $RUNNER_TEMP/medalarm-release.p12"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/medalarm-release.p12
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then echo "❌ No release APK found"; exit 1; fi
          DEST="MedAlarm-${GITHUB_REF_NAME}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $DEST"

      # Build the user-facing release body from CHANGELOG.md (the section whose
      # heading matches this tag) plus a static install/disclaimer footer. End
      # users read friendly notes — never raw commit/PR history.
      - name: Prepare release notes
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          SECTION=""
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v tag="$TAG" '
              $0 ~ "^## +" tag "([[:space:]]|$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          {
            echo "## MedAlarm ${TAG}"
            echo ""
            echo "### Yenilikler"
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "- Bu sürüm için ayrıntılı not eklenmedi."
            fi
            echo ""
            echo "---"
            echo ""
            echo "### Kurulum"
            echo "1. Aşağıdan \`MedAlarm-${TAG}.apk\` dosyasını indirin."
            echo "2. Android telefonunuzda açın ve bu kaynaktan kuruluma izin verin."
            echo "3. İlk açılışta kurulum sihirbazını tamamlayın — özellikle pil optimizasyonu muafiyetini ve (Xiaomi/Samsung/Huawei vb. cihazlarda) arka planda çalışma iznini verin, yoksa hatırlatmalar gecikebilir."
            echo ""
            echo "⚠️ Bu **beta** bir uygulamadır ve bir hatırlatma aracıdır, tıbbi cihaz değildir. Hayati öneme sahip ilaçlar için yalnızca bu uygulamaya güvenmeyin. Uygulama içindeki sorumluluk metnine bakın."
            echo ""
            echo "_Offline, ad-free, 100% on-device — no internet permission, no accounts, no tracking._"
          } > RELEASE_BODY.md
          echo "----- RELEASE_BODY.md -----"
          cat RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MedAlarm ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # Pre-release for any tag containing a hyphen (beta/rc/alpha).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # User-facing notes come from CHANGELOG.md, not auto-generated commits.
          generate_release_notes: false
          files: ${{ steps.apk.outputs.path }}
          body_path: RELEASE_BODY.md
