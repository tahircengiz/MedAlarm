name: Release

# Triggered by pushing a tag like v0.1.0-beta1.
# Builds a signed release APK and publishes a GitHub Release with it attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build signed APK + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuse the same manifesto guard as CI — a release must also be clean.
      - name: Forbid INTERNET permission in manifest
        run: |
          set -e
          shopt -s globstar nullglob
          FAIL=0
          for f in app/src/**/AndroidManifest.xml; do
            HITS=$(xmllint --xpath \
              "count(//uses-permission[@*[local-name()='name' and .='android.permission.INTERNET']])" \
              "$f" 2>/dev/null || echo 0)
            if [ "$HITS" != "0" ]; then echo "❌ INTERNET in $f"; FAIL=1; fi
          done
          [ "$FAIL" = "1" ] && exit 1 || echo "✅ No INTERNET permission."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ SIGNING_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medalarm-release.p12"
          echo "Keystore decoded to $RUNNER_TEMP/medalarm-release.p12"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/medalarm-release.p12
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then echo "❌ No release APK found"; exit 1; fi
          DEST="MedAlarm-${GITHUB_REF_NAME}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $DEST"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MedAlarm ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # Pre-release for any tag containing a hyphen (beta/rc/alpha).
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## MedAlarm ${{ github.ref_name }}

            Offline, ad-free medication reminder. 100% on-device — no internet permission, no accounts, no tracking.

            ### Install
            1. Download `MedAlarm-${{ github.ref_name }}.apk` below.
            2. On your Android phone, open it and allow installation from this source.
            3. On first launch, complete onboarding — **grant the permission wizard steps**, especially battery-optimization exemption and (on Xiaomi/Samsung/Huawei/etc.) autostart, or reminders may be delayed.

            ⚠️ This is **beta** software and a reminder tool, not a medical device. Don't rely on it alone for life-critical medication. See the in-app disclaimer.

            ---
            _Auto-generated commit notes below._
