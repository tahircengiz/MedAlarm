# JVM args — 4 GB is enough for this project; Kotlin K2 compiler is memory-efficient.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Performance: parallel + caching + on-demand configuration
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP — incremental annotation processing
ksp.incremental=true

# Compose — emit compiler metrics + stability reports in release builds
# (these power R8 optimization decisions and surface recomposition issues)
# Uncomment if you want them by default; otherwise toggle per-build with -Pcompose.metrics=true
# compose.metrics=true
# compose.reports=true
